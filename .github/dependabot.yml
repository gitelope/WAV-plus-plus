# GitHub's Dependabot watches the actions used in .github/workflows/.
# When a new version ships, it opens a PR updating the version.
#
# Config is read from main because Dependabot always reads this file from the
# default branch, no matter what target-branch is set to. Everything else—
# scanning and pull requests—follows target-branch, which is set to develop.
#
# So,
# 1. dependencies are scanned on develop,
# 2. PRs are opened against develop,
# 3. edits to this file only take effect once they reach main,
# 4. action version updates only reach main with the next merge of develop into main.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
