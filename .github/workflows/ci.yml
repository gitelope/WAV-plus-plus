name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release

          - name: ubuntu-latest-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release

          - name: ubuntu-latest-clang-debug-sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cxx_flags: -fsanitize=address,undefined -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS -D_GLIBCXX_SANITIZE_VECTOR
            build_type: Debug

          - name: macos-latest-clang
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release

          - name: macos-15-clang
            os: macos-15
            cc: clang
            cxx: clang++
            build_type: Release

          - name: windows-2022-msvc
            os: windows-2022
            build_type: Release

          - name: windows-latest-msvc
            os: windows-latest
            build_type: Release

    steps:
      - uses: actions/checkout@v7

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          -DWAV_PLUS_PLUS_BUILD_TESTS=ON
          -DWAV_PLUS_PLUS_BUILD_EXAMPLES=ON
          -DWAV_PLUS_PLUS_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -A x64
          -DWAV_PLUS_PLUS_BUILD_TESTS=ON
          -DWAV_PLUS_PLUS_BUILD_EXAMPLES=ON
          -DWAV_PLUS_PLUS_WARNINGS_AS_ERRORS=ON

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --parallel
