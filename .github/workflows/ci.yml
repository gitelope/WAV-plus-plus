name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++

          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++

          - name: macos-apple-clang
            os: macos-latest
            cc: clang
            cxx: clang++

          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWAV_PLUS_PLUS_BUILD_TESTS=ON
          -DWAV_PLUS_PLUS_BUILD_EXAMPLES=ON
          -DWAV_PLUS_PLUS_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DWAV_PLUS_PLUS_BUILD_TESTS=ON
          -DWAV_PLUS_PLUS_BUILD_EXAMPLES=ON
          -DWAV_PLUS_PLUS_WARNINGS_AS_ERRORS=ON

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure --parallel
